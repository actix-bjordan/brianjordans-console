# Runs the whole console locally, including a local DynamoDB so no AWS
# resources are touched. Copy .env.example to .env and fill in the Google
# credentials before starting.
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: -jar DynamoDBLocal.jar -sharedDb -inMemory
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  table-setup:
    image: amazon/aws-cli:latest
    depends_on:
      dynamodb:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - |
        if aws dynamodb describe-table --endpoint-url http://dynamodb:8000 --table-name console-users >/dev/null 2>&1; then
          echo "console-users already exists"
          exit 0
        fi
        aws dynamodb create-table \
          --endpoint-url http://dynamodb:8000 \
          --table-name console-users \
          --attribute-definitions AttributeName=email,AttributeType=S \
          --key-schema AttributeName=email,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST >/dev/null
        echo "created console-users"

  console:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      table-setup:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      PORT: "8080"
      PUBLIC_BASE_URL: http://localhost:8080
      USERS_TABLE: console-users
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:-local-development-session-secret-change-me}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-contact@brianjordans.com}
      LOG_LEVEL: debug
